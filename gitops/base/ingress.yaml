# Um único ponto de entrada (ingress-nginx). Cada serviço recebe seu prefixo.
# As métricas do nginx (nginx_ingress_controller_requests) são um dos SLIs do donation-service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: solidarytech
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
    # Proteção básica contra abuso: 50 req/s por IP de origem em cada réplica do controller (burst 5x, excedente = 503).
    # Por isso o teste de carga (scripts/06-sre-chaos.sh load) bate direto no Service interno, e não aqui.
    # Não usar limit-whitelist 10.0.0.0/16: o NLB faz SNAT para o IP do nó (dentro da VPC) e o limite sumiria para todos.
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - { path: /ngos,       pathType: Prefix, backend: { service: { name: ngo-service,       port: { name: http } } } }
          - { path: /donations,  pathType: Prefix, backend: { service: { name: donation-service,  port: { name: http } } } }
          - { path: /volunteers, pathType: Prefix, backend: { service: { name: volunteer-service, port: { name: http } } } }
          - { path: /health,     pathType: Exact,  backend: { service: { name: donation-service,  port: { name: http } } } }
