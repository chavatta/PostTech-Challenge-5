# AppProject: limita de onde o ArgoCD pode puxar manifests e onde pode aplicar (least privilege do GitOps).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: solidarytech
  namespace: argocd
spec:
  description: Plataforma SolidaryTech (apps + plataforma)
  sourceRepos:
    - https://github.com/chavatta/PostTech-Challenge-5.git
    - https://kubernetes.github.io/ingress-nginx
    - https://kubernetes-sigs.github.io/metrics-server/
    - https://prometheus-community.github.io/helm-charts
    - https://grafana.github.io/helm-charts
    - https://helm-charts.newrelic.com
    - https://vmware-tanzu.github.io/helm-charts
  destinations:
    - { server: "https://kubernetes.default.svc", namespace: "*" }
  clusterResourceWhitelist:
    - { group: "*", kind: "*" }
