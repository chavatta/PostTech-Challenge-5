apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"       # ordem de instalação (menor primeiro)
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: solidarytech
  sources:
    - repoURL: https://kubernetes.github.io/ingress-nginx
      chart: ingress-nginx
      targetRevision: "4.*"
      helm:
        releaseName: ingress-nginx
        valueFiles: [$values/gitops/platform/values/ingress-nginx.yaml]
    - repoURL: git@github.com:chavatta/PostTech-Challenge-5.git
      targetRevision: main
      ref: values
  destination: { server: "https://kubernetes.default.svc", namespace: ingress-nginx }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: { limit: 5, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
