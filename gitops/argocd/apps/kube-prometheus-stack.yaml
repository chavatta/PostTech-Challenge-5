apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"       # ordem de instalação (menor primeiro)
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: solidarytech
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "*"
      helm:
        releaseName: kube-prometheus-stack
        valueFiles: [$values/gitops/platform/values/kube-prometheus-stack.yaml]
    - repoURL: git@github.com:chavatta/PostTech-Challenge-5.git
      targetRevision: main
      ref: values
  destination: { server: "https://kubernetes.default.svc", namespace: monitoring }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: { limit: 5, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
