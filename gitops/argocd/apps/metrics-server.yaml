apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metrics-server
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"       # ordem de instalação (menor primeiro)
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: solidarytech
  sources:
    - repoURL: https://kubernetes-sigs.github.io/metrics-server/
      chart: metrics-server
      targetRevision: "3.*"
      helm:
        releaseName: metrics-server
        valueFiles: [$values/gitops/platform/values/metrics-server.yaml]
    - repoURL: git@github.com:chavatta/PostTech-Challenge-5.git
      targetRevision: main
      ref: values
  destination: { server: "https://kubernetes.default.svc", namespace: kube-system }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: { limit: 5, backoff: { duration: 30s, factor: 2, maxDuration: 5m } }
