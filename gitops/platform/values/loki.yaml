# Loki (logs) + Promtail (coleta de todos os pods). Grafana já aponta para http://loki:3100.
loki:
  persistence: { enabled: true, size: 10Gi, storageClassName: gp2 }
  config:
    table_manager: { retention_deletes_enabled: true, retention_period: 168h }   # 7 dias (FinOps)
  resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } }
promtail:
  enabled: true
  resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { cpu: 200m, memory: 128Mi } }
# O chart cria por padrão um ConfigMap de datasource "Loki" com isDefault: true; o sidecar do Grafana do
# kube-prometheus-stack carrega esse ConfigMap junto com o Prometheus (também default) e o Grafana não sobe
# ("Only one datasource per organization can be marked as default"). O datasource Loki já vem de
# additionalDataSources em kube-prometheus-stack.yaml.
grafana: { enabled: false, sidecar: { datasources: { enabled: false } } }
prometheus: { enabled: false }
