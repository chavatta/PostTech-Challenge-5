# Placeholder até a Etapa 8: scripts/08-dr-setup.sh sobrescreve este arquivo renderizando velero.yaml.tpl
# (bucket real do Terraform + Schedules). Aqui NÃO há schedules: com este bucket inexistente o BSL fica
# Unavailable e cada execução de um Schedule viraria um Backup FailedValidation.
# Cópia fixa em velero.placeholder.yaml: a Etapa 4 volta a ela quando o git aponta para o bucket de outro ambiente.
# Sem IRSA no Academy: o Velero usa as credenciais da LabRole do nó (credentials.useSecret=false).
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.11.0
    volumeMounts: [{ mountPath: /target, name: plugins }]
credentials: { useSecret: false }
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: solidarytech-primary-velero-000000000000
      config: { region: us-east-1 }
  volumeSnapshotLocation:
    - name: default
      provider: aws
      config: { region: us-east-1 }
  defaultVolumesToFsBackup: false
deployNodeAgent: true
snapshotsEnabled: true
metrics: { enabled: true, serviceMonitor: { enabled: true } }
resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
