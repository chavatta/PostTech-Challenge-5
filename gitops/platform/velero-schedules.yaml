# ------------------------------------------------------------------------------
# DR opção A — Velero: backup periódico do estado do cluster (manifests + volumes EBS) para S3.
# RPO de configuração do cluster: 1h (hourly). Retenção alinhada ao PCN (docs/PCN.md).
# ------------------------------------------------------------------------------
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: solidarytech-hourly
  namespace: velero
  annotations: { argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true }
spec:
  schedule: "0 * * * *"
  template:
    includedNamespaces: [solidarytech]
    snapshotVolumes: true
    ttl: 72h0m0s
    storageLocation: default
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: platform-daily
  namespace: velero
  annotations: { argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true }
spec:
  schedule: "30 3 * * *"
  template:
    includedNamespaces: [solidarytech, monitoring, ingress-nginx, argocd]
    snapshotVolumes: true
    ttl: 720h0m0s        # 30 dias, igual ao lifecycle do bucket
    storageLocation: default
